version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: docker/catalog-service/Dockerfile.dev
    container_name: kt-jab-houy-app-catalog-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    volumes:
      - ./src:/home/java/app/src
      - ./build/classes:/home/java/app/build/classes
      - gradle-cache:/home/gradle/.gradle
    networks:
      - kt-network

volumes:
  gradle-cache:

networks:
  kt-network:
    external: true