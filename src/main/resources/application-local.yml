spring:
  application:
    debug-mode: ${DEBUG_MODE:true}

  datasource:
    url: jdbc:postgresql://${DB_HOST:kt-postgresql-db}:${DB_PORT:5432}/${DB_NAME:kt-jab-houy-db}
    username: ${DB_USER:kt-jab-houy-user}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${spring.application.debug-mode}